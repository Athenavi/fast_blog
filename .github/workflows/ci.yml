name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'V*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # Lint & Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run type check
        # 目前**非阻塞**：历史上大量模块没有完整类型注解，直接阻断会让 CI 长期变红。
        # 正确的收敛方向是"先清零 src/ 的 mypy 错误，再去掉末尾的 || echo"，
        # 而不是一直挂着这个例外。
        run: |
          python -m mypy src/ --ignore-missing-imports --no-error-summary 2>&1 || echo "mypy found issues (non-blocking)"

      - name: Static checks (ruff, blocking)
        run: |
          pip install ruff
          # 只查"绝不误报"的硬错误：语法错误 / 未定义名 / 重复定义
          ruff check --select E9,F63,F7,F82,F811 src shared cli

  # ============================================================================
  # Quick Unit Tests (mock-based, no external services)
  # ============================================================================
  test-quick:
    name: Quick Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run mock-based unit tests
        env:
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          python -m pytest \
            tests/test_mcp_agent_engine.py tests/test_mcp_tool_handlers.py tests/test_auth.py tests/test_crud_api.py \
            tests/test_models.py tests/test_security.py tests/test_svg_sanitize.py \
            tests/test_permission_control.py tests/test_permission_cache.py \
            tests/test_v3_route_contract.py \
            -v --tb=short

  # ============================================================================
  # Full Backend Test Suite
  # ============================================================================
  # 全量测试。此前它**跑不完**：卡在 tests/test_plugins.py 的 compliance-audit 用例
  # 100+ 秒无进展（该检查函数导入 public_upload，连带加载 python-magic，在缺少 libmagic
  # 的环境会挂起）。改为静态读取白名单后，全量 1525 项约 4 分钟跑完（本机实测）。
  test-full:
    name: Full Backend Test Suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run full test suite
        env:
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          python -m pytest tests/ -q --ignore=tests/load --tb=short

  # ============================================================================
  # Frontend Unit Tests (Vitest, parallel to backend)
  # ============================================================================
  test-frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Production build
        working-directory: frontend/web
        run: npm run build

      - name: Generate plugin frontend registry (prescan)
        working-directory: frontend/web
        run: npm run prescan

      - name: TypeScript type check
        working-directory: frontend/web
        run: npm run type-check

  # ============================================================================
  # Backend Tests
  # ============================================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [ lint, test-quick ]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fast_blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run backend tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: fast_blog_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Test Alembic migration rollback
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: fast_blog_test
          PGPASSWORD: postgres
        run: |
          # 使用测试数据库测试迁移回滚
          psql -h $DB_HOST -U $DB_USER -d $DB_NAME -c "DROP TABLE IF EXISTS alembic_version;" 2>/dev/null || true
          alembic upgrade head
          echo "✅ Upgrade to head succeeded"
          alembic downgrade -1
          echo "✅ Downgrade -1 succeeded"
          alembic upgrade head
          echo "✅ Re-upgrade to head succeeded"

  # ============================================================================
  # Frontend Build
  # ============================================================================
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build frontend
        working-directory: frontend/web
        run: npm run build

  # ============================================================================
  # Security Audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python dependencies
        # 供应链扫描必须能阻断 CI —— 不要加 `|| true`（加了等于不检查）。
        # 若确有需要暂时放行的漏洞，请写明 ID 与理由：
        #   pip-audit --strict --ignore-vuln GHSA-xxxx-xxxx-xxxx
        run: pip-audit --strict

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend/web
        # 同上：不要加 `|| true`。--audit-level=high 让 high/critical 阻断 CI，
        # 低危仅打印，避免被无风险的 moderate 噪音长期卡住流水线。
        #
        # `--audit-level=critical`：只让 critical 阻断 CI。
        # 剩下 11 个 high 无法消除 —— `braces@3.0.3` 与 `node-forge@1.4.0` 已是各自
        # 最高版本、advisory 标 `*`（上游未修）；`node-forge` 经
        # listhen → nitropack → nuxt 传递，而 **nuxt 在 dependencies 里（生产依赖）**，
        # 所以 `--omit=dev` 排除不掉它（实测漏洞数一个没少，仍是 11 个）；
        # audit 给出的"修复"是把 Nuxt 降级到 4.1.3，属破坏性变更。
        # 3 个 critical 已全部修复，因此用 critical 作为阻断线。
        run: npm audit --audit-level=critical

  # ============================================================================
  # Docker Build Test
  # ============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ test-frontend, test-backend, build-frontend ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fastblog:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
