# FastBlog Nginx Configuration
# Production-ready reverse proxy configuration

upstream backend {
    server backend:9421;
    keepalive 32;
}

upstream frontend {
    # Nuxt SSR node 服务（frontend/web/Dockerfile 的 EXPOSE 端口）
    server frontend:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

server {
    listen 80;
    server_name _;

    # Security headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 注意：Strict-Transport-Security(HSTS) 仅在 HTTPS 下才被浏览器识别，
    # 在纯 HTTP(80) 上发送无效且安全无益。HSTS 已移到下方 443 ssl server 块。
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # HTTP→HTTPS：启用 TLS 后，若希望强制全站跳转 HTTPS，可在此 server 块
    # 用如下 return 替换全部 location（否则保持 80 直接服务）：
    #   return 301 https://$host$request_uri;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Client settings
    client_max_body_size 60M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # 登录 / 注册的独立限流（复用 http 级 login zone：rate=5r/m）
    # 正则 location 优先级高于下方前缀 location /api/，命中后不再回落到 /api/；
    # nginx 的 location 不会跨 server 块继承，因此 443 模板里有同样一段。
    location ~ ^/api/v3/(system|mobile)/auth/(login|register) {
        limit_req zone=login burst=10 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # API endpoints（v2 下线后 /api/** 全部落到 v3；v1/v2 专用 location 已移除）
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket：群聊（/api/v3/chat/message/ws/...）与协作 yjs 要借用同一个 location，
        # 因此按 $connection_upgrade 映射转发 Upgrade（普通请求映射为 close，语义不变）。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # 媒体文件（/api/v3/content/media/{id}/file、封面）自带 immutable 缓存头，
    # 由上方 location /api/ 统一转发；旧 /media/ 代理块已随 v2 一并移除。

    # Frontend (catch-all)
    location / {
        limit_req zone=general burst=100 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://backend/api/v3/health;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        proxy_pass http://frontend;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
        proxy_pass http://frontend;
    }

    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://backend;
    }
}

# ============================================================================
# HTTPS (443/TLS) 未在此文件启用
# ============================================================================
# 模板见同目录的 `fastblog-tls.conf.example`：把证书放进 nginx/ssl/ 后，
# 去掉 `.example` 后缀即可启用（该文件不在 `conf.d/*.conf` 通配内，故默认不加载）。
#
# ⚠️ 与 SITE_URL 的联动：`SITE_URL` 是 Cookie 是否带 `Secure` 的唯一判定依据。
#   - 只跑 HTTP 时，SITE_URL 必须写 http://...（否则浏览器拒收 Secure Cookie，登录后掉线）
#   - 启用本文件的 HTTPS 后，SITE_URL 必须写 https://...
# ============================================================================
