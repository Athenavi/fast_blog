user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # 限制请求体大小（前端上传/媒体文件根据实际业务调整，60M 已在 location 中覆盖）
    client_max_body_size 20M;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 缓存配置
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=fastblog_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # 限流（具体 zone 定义见 conf.d/fastblog.conf，各 zone 名称不同故不冲突）
    # 本文件仅保留通用配置，限流细节下沉到 fastblog.conf 中

    # WebSocket 升级映射：/api/ 下的群聊（/api/v3/chat/message/ws/...）与协作 yjs
    # 是长连接，必须转发 Upgrade 头；普通请求则保持连接语义不变。
    #
    # 注意：这个 map 只用于 `/api/`。**页面与静态资源**（`location /`、`location /_nuxt/`）
    # 不经过它，而是直接用 `proxy_set_header Connection "";` —— 因为 `Connection: close`
    # 同样会让 `upstream` 的 keepalive 池失效（nginx 只在 Connection 头为空时复用上游连接）。
    # 用空串是 nginx 官方 keepalive 文档给出的写法，语义确定；而把它做成 map 值
    # （`'' ''`）在无 nginx 可 `-t` 校验的环境里风险更高，故不采用。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
