# 多租户站点隔离：纳入 / 排除的表清单
#
# 这是 scripts/apply_tenant_scope.py 的唯一输入。想调整隔离范围，改这里再重跑脚本，
# 不要在 yaml 和模型文件里各改一遍。
#
# 判定原则
# --------
# - **站点级（tenant_tables）**：内容与业务数据。同一套部署服务多个站点时，
#   每个站点只应看到自己的文章、媒体、评论、订单、广告、统计……
# - **实例级（excluded_tables）**：账号与权限定义（users / roles / capabilities）、
#   系统与第三方凭据（system_settings / ai_configs / sso_providers）、
#   以及跨站点治理数据（audit_logs / login_attempts / token_blacklist）。
#   这些要么天然跨站点（一个账号访问多个站点，见 sites/site_users 关联），
#   要么必须让超管看到全貌。
#
# 出现未分类的表时，`python -m scripts.apply_tenant_scope --check` 会列出来，
# 必须显式归到两边之一 —— 默认猜测比不猜更危险。

