<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img"
     aria-label="WordPress 主题预览">
    <rect width="1200" height="900" fill="#f6f7f7"/>
    <!-- 页头（布局契约提供，主题只影响配色） -->
    <rect x="0" y="0" width="1200" height="64" fill="#ffffff"/>
    <rect x="0" y="63" width="1200" height="1" fill="#dcdcde"/>
    <rect x="40" y="24" width="140" height="16" rx="3" fill="#1d2327"/>
    <rect x="960" y="26" width="60" height="12" rx="3" fill="#2271b1"/>
    <rect x="1040" y="26" width="60" height="12" rx="3" fill="#50575e"/>
    <!-- 主栏 -->
    <rect x="40" y="112" width="400" height="34" rx="4" fill="#1d2327"/>
    <rect x="40" y="158" width="620" height="14" rx="3" fill="#50575e"/>
    <rect x="40" y="212" width="780" height="200" rx="3" fill="#ffffff" stroke="#dcdcde"/>
    <rect x="60" y="236" width="420" height="18" rx="3" fill="#2271b1"/>
    <rect x="60" y="268" width="720" height="11" rx="3" fill="#50575e"/>
    <rect x="60" y="290" width="690" height="11" rx="3" fill="#50575e"/>
    <rect x="60" y="312" width="640" height="11" rx="3" fill="#c3c4c7"/>
    <rect x="40" y="436" width="780" height="160" rx="3" fill="#ffffff" stroke="#dcdcde"/>
    <rect x="60" y="460" width="360" height="16" rx="3" fill="#2271b1"/>
    <rect x="60" y="490" width="700" height="11" rx="3" fill="#50575e"/>
    <rect x="60" y="512" width="660" height="11" rx="3" fill="#50575e"/>
    <!-- 右侧栏：三个小工具 -->
    <rect x="860" y="212" width="300" height="150" rx="3" fill="#ffffff" stroke="#dcdcde"/>
    <rect x="880" y="232" width="120" height="15" rx="3" fill="#1d2327"/>
    <rect x="880" y="255" width="260" height="1" fill="#dcdcde"/>
    <rect x="880" y="270" width="180" height="11" rx="3" fill="#50575e"/>
    <rect x="880" y="292" width="210" height="11" rx="3" fill="#50575e"/>
    <rect x="880" y="314" width="160" height="11" rx="3" fill="#50575e"/>
    <rect x="880" y="336" width="190" height="11" rx="3" fill="#50575e"/>
    <rect x="860" y="382" width="300" height="130" rx="3" fill="#ffffff" stroke="#dcdcde"/>
    <rect x="880" y="402" width="140" height="15" rx="3" fill="#1d2327"/>
    <rect x="880" y="425" width="260" height="1" fill="#dcdcde"/>
    <rect x="880" y="440" width="230" height="11" rx="3" fill="#50575e"/>
    <rect x="880" y="462" width="200" height="11" rx="3" fill="#50575e"/>
    <rect x="880" y="484" width="240" height="11" rx="3" fill="#50575e"/>
    <rect x="860" y="532" width="300" height="120" rx="3" fill="#ffffff" stroke="#dcdcde"/>
    <rect x="880" y="552" width="90" height="15" rx="3" fill="#1d2327"/>
    <rect x="880" y="578" width="70" height="26" rx="3" fill="#f6f7f7" stroke="#dcdcde"/>
    <rect x="960" y="578" width="88" height="26" rx="3" fill="#f6f7f7" stroke="#dcdcde"/>
    <rect x="1058" y="578" width="62" height="26" rx="3" fill="#f6f7f7" stroke="#dcdcde"/>
    <rect x="880" y="612" width="80" height="26" rx="3" fill="#f6f7f7" stroke="#dcdcde"/>
    <!-- 页脚 -->
    <rect x="0" y="836" width="1200" height="64" fill="#ffffff"/>
    <rect x="0" y="836" width="1200" height="1" fill="#dcdcde"/>
    <rect x="40" y="862" width="220" height="11" rx="3" fill="#646970"/>
    <!-- 标注：WordPress 蓝 -->
    <rect x="1132" y="24" width="28" height="16" rx="3" fill="#2271b1"/>
