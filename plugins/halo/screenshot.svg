<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img"
     aria-label="Halo 主题预览">
    <rect width="1200" height="900" fill="#ffffff"/>
    <!-- 页头（布局契约提供，主题只影响配色） -->
    <rect x="0" y="0" width="1200" height="64" fill="#ffffff"/>
    <rect x="0" y="63" width="1200" height="1" fill="#e2e8f0"/>
    <rect x="40" y="24" width="120" height="16" rx="8" fill="#0f172a"/>
    <rect x="1000" y="26" width="70" height="12" rx="6" fill="#4f46e5"/>
    <rect x="1090" y="26" width="70" height="12" rx="6" fill="#64748b"/>
    <!-- 居中 Hero -->
    <rect x="420" y="120" width="360" height="30" rx="15" fill="#0f172a"/>
    <rect x="480" y="166" width="240" height="13" rx="6" fill="#64748b"/>
    <!-- 胶囊分类 -->
    <rect x="470" y="212" width="76" height="28" rx="14" fill="#f8fafc"/>
    <rect x="556" y="212" width="70" height="28" rx="14" fill="#f8fafc"/>
    <rect x="636" y="212" width="94" height="28" rx="14" fill="#f8fafc"/>
    <!-- 三栏卡片网格（大圆角 + 柔和阴影） -->
