# FastBlog Production Docker Compose Configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # ============================================================================
  # FastBlog Backend
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      network: host
      additional_contexts:
        ffmpeg_src: ./tools/ffmpeg
    container_name: fastblog-backend
    restart: always
    ports:
      - "127.0.0.1:9421:9421"
    environment:
      # --- 数据库配置（Docker 内部网络，host 使用服务名） ---
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-fast_blog}
      # --- Redis 配置 ---
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      # --- 应用配置 ---
      # 生产必须显式提供强密钥，缺失时 compose 直接报错（避免每次重启生成随机密钥导致会话失效）
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env (>=32 random chars)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env (>=32 random chars)}
      - ENVIRONMENT=production
      - DEBUG=False
      # 多 worker 进程数（>1 时启用；依赖 Redis 共享限流/缓存，调度任务由 Redis 分布式锁保证单次执行）
      - WORKERS=${WORKERS:-2}
      # 内置插件开关：逗号分隔需要关闭的非核心模块名，如 ecommerce,enterprise
      - DISABLED_MODULES=${DISABLED_MODULES:-}
    # 不设置 user — entrypoint 默认以 root 运行，初始化后通过 gosu 降权到 appuser
    volumes:
      - fastblog-media:/app/media
      - fastblog-uploads:/app/uploads
      - fastblog-logs:/app/logs
      - fastblog-backups:/app/backups
      - fastblog-plugins-data:/app/plugins_data
      - fastblog-storage:/app/storage
      - fastblog-config:/app/config
      - fastblog-static-generated:/app/static_generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastblog-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9421/api/v3/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Frontend (Nuxt 4 — 前台 SSR + 后台 CSR 同一工程，Node 运行时)
  # ============================================================================
  # 只在内网暴露 3000，外部流量统一由下方 nginx 服务入口转发（TLS / 安全头 / 限流）。
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: fastblog-frontend
    restart: always
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://backend:9421
    depends_on:
      - backend
    networks:
      - fastblog-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Nginx (统一入口：TLS / 安全头 / 限流 / 缓存 + /api、/media 反代)
  # ============================================================================
  nginx:
    image: nginx:1-alpine
    container_name: fastblog-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - fastblog-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - fastblog-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fastblog-postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # 口令必填（请在 .env 中显式提供 STRONG 口令），缺失/为空时 compose 直接报错失败，避免弱默认口令
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-fast_blog}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - fastblog-postgres:/var/lib/postgresql/data
    networks:
      - fastblog-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: fastblog-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - fastblog-redis:/data
    networks:
      - fastblog-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env} ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================================
# Volumes (named volumes for persistence)
# ============================================================================
volumes:
  fastblog-postgres:
    driver: local
  fastblog-redis:
    driver: local
  fastblog-media:
    driver: local
  fastblog-uploads:
    driver: local
  fastblog-logs:
    driver: local
  fastblog-backups:
    driver: local
  fastblog-config:
    driver: local
  fastblog-storage:
    driver: local
  fastblog-plugins-data:
    driver: local
  fastblog-static-generated:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  fastblog-network:
    driver: bridge
