# FastBlog Docker Compose Configuration
# Usage: docker-compose up -d

services:
  # ============================================================================
  # FastBlog Backend (FastAPI)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      additional_contexts:
        ffmpeg_src: ./tools/ffmpeg
    container_name: fastblog-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9421}:9421"
    environment:
      # --- 数据库配置（Docker 内部网络，host 使用服务名） ---
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-fast_blog}
      # --- Redis 配置 ---
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # --- 应用配置 ---
      # SECRET_KEY 生成示例：python -c "import secrets; print(secrets.token_urlsafe(32))"
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env (>=32 random chars)}
      - ENVIRONMENT=production
      - DEBUG=False
    # 注意：不设置 user，Dockerfile 无 USER 指令，默认 root
    # entrypoint 以 root 运行初始化后，通过 gosu 降权到 appuser
    volumes:
      # 所有可写目录使用命名卷 — 从镜像继承 appuser:appuser 权限，无权限问题
      - fastblog-media:/app/media
      - fastblog-uploads:/app/uploads
      - fastblog-logs:/app/logs
      - fastblog-backups:/app/backups
      - fastblog-config:/app/config
      - fastblog-storage:/app/storage
      - fastblog-plugins-data:/app/plugins_data
      - fastblog-static-generated:/app/static_generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastblog-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9421/api/v3/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # Frontend (Nuxt 4 — 前台 SSR + 后台 CSR 同一工程，Node 运行时)
  # ============================================================================
  # 只在内网暴露 3000，不直接对外；外部流量统一由下方 nginx 服务入口转发。
  # SSR 期间服务端请求后端走容器网络绝对地址（见 NUXT_PUBLIC_API_BASE_URL）；
  # 浏览器侧走同源 /api，由 nginx 反代到 backend。
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: fastblog-frontend
    restart: unless-stopped
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://backend:9421
    depends_on:
      - backend
    networks:
      - fastblog-network
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ============================================================================
  # Nginx (统一入口：TLS / 安全头 / 限流 / 缓存 + /api、/media 反代)
  # ============================================================================
  # 配置在 nginx/ 目录（nginx.conf + conf.d/fastblog.conf），只读挂载。
  nginx:
    image: nginx:1-alpine
    container_name: fastblog-nginx
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4321}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - fastblog-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - fastblog-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fastblog-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-fast_blog}
    volumes:
      - fastblog-postgres:/var/lib/postgresql/data
    networks:
      - fastblog-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: fastblog-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - fastblog-redis:/data
    networks:
      - fastblog-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================================
# Volumes (named volumes — Docker manages ownership, no permission issues)
# ============================================================================
volumes:
  fastblog-postgres:
    driver: local
  fastblog-redis:
    driver: local
  fastblog-media:
    driver: local
  fastblog-uploads:
    driver: local
  fastblog-logs:
    driver: local
  fastblog-backups:
    driver: local
  fastblog-config:
    driver: local
  fastblog-storage:
    driver: local
  fastblog-plugins-data:
    driver: local
  fastblog-static-generated:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  fastblog-network:
    driver: bridge
